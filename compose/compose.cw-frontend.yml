services:
  fg-cw-frontend:
    build: .
    ports:
      - "3100:3100"
    env_file:
      - ".env"
    develop:
      watch:
        - path: ./src
          target: /home/node/src
          action: sync+restart
    environment:
      PORT: 3100
      NODE_ENV: development
      FG_CW_BACKEND: http://fg-cw-backend:3101
      OIDC_DISCOVERY_URI: http://entra:3010/.well-known/openid-configuration
      REDIS_HOST: redis
    networks:
      - cdp-tenant
